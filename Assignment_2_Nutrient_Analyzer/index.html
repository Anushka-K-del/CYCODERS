<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nutrient Analyzer</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>🌸 Nutrient Analyzer</h1>
        <p>Check the nutrition in your food</p>
    </header>

    <main>

        <section>
            <h2>🍎 Enter Your Food</h2>

            <label for="food">Food name:</label>
            <input type="text" id="food" placeholder="Example: banana">

            <label for="quantity">Quantity (in grams):</label>
            <input type="number" id="quantity" placeholder="Example: 100">

            <button id="analyze">Analyze Nutrition</button>
            <button id="clear">Clear</button>
        </section>

        <div id="result">
            <h2>📊 Nutrition Result</h2>
            <p>Enter a food item and click "Analyze Nutrition" to see the result.</p>
        </div>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
